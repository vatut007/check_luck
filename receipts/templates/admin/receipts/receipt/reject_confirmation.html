{% extends "admin/base_site.html" %}

{% block content %}
<form method="post">
  {% csrf_token %}
  <p>Причина отказа будет применена к {{ receipts|length }} чек(ам) в статусе «На проверке»:</p>
  <ul>
    {% for receipt in receipts %}
      <li>{{ receipt }} — {{ receipt.user }}</li>
      <input type="hidden" name="{{ action_checkbox_name }}" value="{{ receipt.pk }}">
    {% endfor %}
  </ul>
  <input type="hidden" name="action" value="reject_selected">
  <p>
    <label for="id_reason">Причина отказа:</label><br>
    <textarea name="reason" id="id_reason" rows="4" cols="60" required></textarea>
  </p>
  <input type="submit" name="apply" value="Отклонить">
  <a href="." class="button cancel-link">Отмена</a>
</form>
{% endblock %}
