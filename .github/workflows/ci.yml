name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: promo
          POSTGRES_USER: promo
          POSTGRES_PASSWORD: promo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promo -d promo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "true"
      DJANGO_SECURE_COOKIES: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://promo:promo@localhost:5432/promo
      PROMO_START: "2026-10-01"
      PROMO_END: "2026-10-31"
      PROMO_TIMEZONE: Europe/Moscow
      PROMO_MIN_AMOUNT: "1000"
      RECEIPT_PHOTO_MAX_MB: "5"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        run: uv run pytest
