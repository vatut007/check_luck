[project]
name = "check-luck"
version = "0.1.0"
description = "Промо-акция «Чек на удачу»"
authors = [
    { name = "Илья Ватютов", email = "vatut007@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "drf-spectacular>=0.27",
    "pillow>=10.4",
    "whitenoise>=6.7",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
